name: QQ Music

description: QQ Music (QQ音乐) is a leading Chinese online music streaming service operated by Tencent. It offers a massive catalog of high‑quality,
  lossless tracks, personalized playlists, and social sharing features. Users can stream, download, and enjoy curated recommendations across web
  and mobile platforms, making it a central hub for music entertainment in China.

